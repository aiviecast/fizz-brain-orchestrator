[package]
name = "fizz_brain_orchestrator"
version = "0.2.0"
description = "Fizz brain — compose the comment -> sentence-fragment pipeline (classify, few-shot, prompt, LLM, parse). NDJSON in/out CLI."

[dependencies]
fizz_protocol = { git = "https://github.com/aiviecast/fizz-protocol", tag = "v0.3.0" }
fizz_persona = { git = "https://github.com/aiviecast/fizz-persona", tag = "v0.3.0" }
fizz_llm_client = { git = "https://github.com/aiviecast/fizz-llm-client", tag = "v0.3.0" }
fizz_comment_classifier = { git = "https://github.com/aiviecast/fizz-comment-classifier", tag = "v0.2.0" }
fizz_few_shot_retriever = { git = "https://github.com/aiviecast/fizz-few-shot-retriever", tag = "v0.2.0" }
fizz_stream_sentence_parser = { git = "https://github.com/aiviecast/fizz-stream-sentence-parser", tag = "v0.2.0" }
fizz_conversation_history = { git = "https://github.com/aiviecast/fizz-conversation-history", tag = "v0.1.1" }
fizz_thinking_cue_detector = { git = "https://github.com/aiviecast/fizz-thinking-cue-detector", tag = "v0.2.0" }
fizz_prompt_builder = { git = "https://github.com/aiviecast/fizz-prompt-builder", tag = "v0.2.0" }

# Dialect epoch 15 (#4093): a git dependency outside github.com/almide is fetched only
# from an owner the root manifest trusts.
[trust]
owners = ["github.com/aiviecast"]
